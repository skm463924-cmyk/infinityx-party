<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InfinityX Party</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100d19;color:#fff;font-family:Arial,sans-serif;padding-bottom:75px}.header{padding:22px 18px;background:#1c1529}.logo{font-size:26px;font-weight:bold;color:#b69cff}.muted{color:#bcb3ce;font-size:14px;margin-top:8px}.hero{margin:16px;padding:22px;border-radius:18px;background:linear-gradient(135deg,#542a91,#211638)}.section{padding:10px 17px}.countries{display:flex;flex-wrap:wrap;gap:8px}.country{background:#241b34;color:white;border:1px solid #55416e;border-radius:22px;padding:10px}.active{background:#7546d9!important}.room{background:#211a2c;border:1px solid #3d304f;padding:14px;border-radius:14px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.room h3{font-size:15px;margin:0 0 8px}.room p{font-size:12px;color:#c4b8d6;margin:0}.join,.create{background:#8756ef;color:white;border:0;border-radius:22px;padding:11px}.create{width:100%;padding:14px;font-size:15px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#1c1529;padding:15px 0}.nav button{background:none;border:0;color:#c5b8dd;font-size:12px}.note{text-align:center;color:#aaa;font-size:12px;padding:12px}
</style>
</head>
<body>
<header class="header"><div class="logo">∞ InfinityX</div><div class="muted">Infinite Vibes · Unlimited Friends</div></header>
<div class="hero"><h2>Welcome to InfinityX ✨</h2><p>Meet friends. Join the vibe!</p></div>
<section class="section"><h3>🌏 Choose Country</h3><div class="countries"><button class="country active" data-c="All">🌐 All</button><button class="country" data-c="Bangladesh">🇧🇩 Bangladesh</button><button class="country" data-c="India">🇮🇳 India</button><button class="country" data-c="Pakistan">🇵🇰 Pakistan</button></div></section>
<section class="section"><h3>🎙️ Party Rooms</h3><div id="rooms"></div><button class="create" id="create">＋ Create Demo Room</button><p class="note">Demo version · Voice chat is not connected yet.</p></section>
<nav class="nav"><button onclick="home()">🏠<br>Home</button><button onclick="showRooms()">🎙️<br>Rooms</button><button onclick="alert('Messaging will be added later.')">💬<br>Messages</button><button onclick="alert('Profile feature will be added later.')">👤<br>Profile</button></nav>
<script>
const rooms=[{name:'Bangla Adda 🇧🇩',country:'Bangladesh',n:28},{name:'India Friends 🇮🇳',country:'India',n:16},{name:'Pakistan Lounge 🇵🇰',country:'Pakistan',n:21},{name:'Night Vibes 🌙',country:'Bangladesh',n:12}];
let chosen='All';
function render(){document.getElementById('rooms').innerHTML=rooms.filter(r=>chosen==='All'||r.country===chosen).map(r=>'<div class="room"><div><h3>'+r.name+'</h3><p>'+r.country+' · 👥 '+r.n+' members</p></div><button class="join" onclick="joinRoom()">Join</button></div>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('active',b.dataset.c===chosen))}
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{chosen=b.dataset.c;render()});
function joinRoom(){alert('This is a demo. Real voice rooms are not connected yet.')}
document.getElementById('create').onclick=()=>{let name=prompt('Room name?');if(name&&name.trim()){rooms.unshift({name:name.trim(),country:chosen==='All'?'Bangladesh':chosen,n:1});render()}};
function home(){chosen='All';render();window.scrollTo(0,0)}
function showRooms(){document.getElementById('rooms').scrollIntoView({behavior:'smooth'})}
render();
</script>
</body>
</html>
